<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiencia 01 - Grid</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body>
  <div class="container">
    <h2 class="text-center mt-4">Nuestros Servicios</h2>

    <div class="row g-3 mt-2" id="fila-servicios">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="p-3 border bg-light h-100">
          <h4>Auditoría de Sistemas</h4>
          <p>Evaluación exhaustiva de la infraestructura tecnológica.</p>
        </div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="p-3 border bg-light h-100">
          <h4>Desarrollo a Medida</h4>
          <p>Creación de software adaptado a las necesidades empresariales.</p>
        </div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="p-3 border bg-light h-100">
          <h4>Ciberseguridad</h4>
          <p>Protección de activos de información y análisis de vulnerabilidades.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
