<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultural - Contacto</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <div class="contenedor">
            <div class="logo">
                <img src="imagenes/logo.png" alt="Logo Cultural">
            </div>
            <button class="hamburguesa" aria-label="Menú">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav>
                <ul class="menu">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="programas.html">Programas</a></li>
                    <li><a href="contacto.html" class="activo">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="contacto">
            <h2>Contáctanos</h2>
            <div class="grid-contacto">
                <form action="#" method="post">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Tu nombre" required>

                    <label for="email">Correo:</label>
                    <input type="email" id="email" placeholder="tú@email.com" required>

                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" rows="4" placeholder="Escribe tu mensaje..."></textarea>

                    <button type="submit" class="btn">Enviar</button>
                </form>
                <div class="info">
                    <h3>Información de contacto</h3>
                    <p>Dirección: Calle Melgar 109 - Arequipa</p>
                    <p>Teléfono: (054) 39 1020</p>
                    <p>Correo: informes@cultural.edu.pe</p>
                    <p>Horario: Lun - Vie 8am - 8pm</p>
                    <p>Horario: Sáb 9am - 1pm</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 CENTRO CULTURAL PERUANO NORTEAMERICANO</p>
        <p><a href="mailto:informes@cultural.edu.pe">informes@cultural.edu.pe</a></p>
    </footer>

    <script>
        const hamburguesa = document.querySelector('.hamburguesa');
        const menu = document.querySelector('.menu');
        hamburguesa.addEventListener('click', () => {
            menu.classList.toggle('abierto');
        });
        document.querySelectorAll('.menu a').forEach(enlace => {
            enlace.addEventListener('click', () => {
                menu.classList.remove('abierto');
            });
        });
    </script>
</body>
</html>
