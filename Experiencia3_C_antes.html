<!DOCTYPE html>
<head>
  <title>Antes: estilo repetido en cada celda</title>
  <style>
    table {
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid black;
      padding: 6px 12px;
    }
  </style>
</head>
<body>

  <h1>Antes: estilo repetido en cada celda</h1>

  <table>
    <tr>
      <th>Dato 1</th>
      <th style="background-color: yellow">Dato 2</th>
    </tr>
    <tr>
      <td>Calcuta</td>
      <td style="background-color: yellow">Pizza</td>
    </tr>
    <tr>
      <td>Robots</td>
      <td style="background-color: yellow">Jazz</td>
    </tr>
  </table>

</body>
</html>
